<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
 <link rel="manifest" href="manifest.json">
 <meta name="google" content="notranslate">
  <title>Kavalkaran Dialer | English</title>
  <style>
    body {
      margin: 0;
      font-family: 'Noto Sans Malayalam', sans-serif;
      background: #1a1a1a;
      color: white;
      text-align: center;
    }

    header {
      background: #ff1a1a;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .container {
      padding: 20px;
    }

    .btn {
      display: block;
      margin: 15px auto;
      padding: 20px 30px;
      font-size: 20px;
      background: #ff3333;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
      transition: 0.2s ease;
    }

    .btn:hover {
      background: #e60000;
    }

    footer {
      font-size: 14px;
      margin-top: 40px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>🚨 Kavalkaran - Safety Dialer</header>

  <div class="container">
    <button class="btn" onclick="dial('100')">👮🏼‍♀️ Police Help (100)</button>
    <button class="btn" onclick="dial('112')">📞 Emergency Number (112)</button>
    <button class="btn" onclick="dial('101')">🔥 Fire Force (101)</button>
    <button class="btn" onclick="dial('102')">🚑 Ambulance (102)</button>
    <button class="btn" onclick="dial('1091')">👩 Women Helpline (1091)</button>
    <button class="btn" onclick="dial('1930')">🛡️ Cyber Crime Report (1930)</button>
    <button class="btn" onclick="dial('1098')">🧒🏻 Child Line (1098)</button>
  </div>

  <footer>Developed by Athul | Kavalkaran 🔐</footer>

  <script>
    function dial(number) {
      window.location.href = 'tel:' + number;
    }
  </script>
  <script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement(
    {
      pageLanguage: 'ml',
      includedLanguages: `
        en,hi,ml,ta,te,kn,mr,gu,pa,bn,ur,ne,si,sa,
        ar,fa,tr,he,
        fr,de,es,pt,it,nl,sv,no,da,fi,
        ru,uk,pl,cs,sk,hu,ro,bg,
        zh-CN,zh-TW,ja,ko,th,vi,id,ms,
        sw,zu,af,
        el,la
      `.replace(/\s+/g, ''),
      autoDisplay: false,
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE
    },
    'google_translate_element'
  );

  applyLangFromURL();
}

/* 📌 Read ?lang=hi */
function applyLangFromURL() {
  const params = new URLSearchParams(window.location.search);
  const lang = params.get('lang');
  if (!lang) return;

  setTimeout(() => {
    const select = document.querySelector('.goog-te-combo');
    if (select) {
      select.value = lang;
      select.dispatchEvent(new Event('change'));
    }
  }, 1200);
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<div id="google_translate_container"
     style="
       position: fixed;
       top: 14px;
       right: 14px;
       z-index: 9999;
       background: #1e293b;
       padding: 6px 10px;
       border-radius: 10px;
       box-shadow: 0 4px 12px rgba(0,0,0,.35);
     ">
  <div id="google_translate_element"></div>
</div>

</body>
</html>
